[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-rescue-agent"
version = "0.1.0"
description = "Deterministic deal triage with two ADK agents for the parts that need reading comprehension"
requires-python = ">=3.11"
dependencies = [
    "google-adk==2.9.1",
    "pydantic>=2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
